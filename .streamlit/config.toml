[theme]
base = "light"
primaryColor = "#4f46e5"
backgroundColor = "#f4f6fb"
secondaryBackgroundColor = "#ffffff"
textColor = "#0b1220"
font = "sans serif"
borderColor = "#e3e8f2"
baseRadius = "large"

[theme.sidebar]
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f8fafc"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true

[browser]
gatherUsageStats = false
